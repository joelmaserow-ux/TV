[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "samsung-tv-mcp"
version = "0.1.0"
description = "MCP server for controlling a 2014 Samsung H-series Smart TV (e.g. UA55H6300) over the local network"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "samsungtvws[async,encrypted]>=3,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
samsung-tv-mcp = "samsung_tv_mcp.server:main"
samsung-tv = "samsung_tv_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
